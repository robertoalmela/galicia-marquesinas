<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquesinas de Galicia · Street View</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #08090a; color: #e0e0e0; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }

  /* Sidebar */
  #sidebar {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    width: 280px; background: rgba(8,9,10,0.92); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 16px; backdrop-filter: blur(12px);
    max-height: calc(100vh - 24px); overflow-y: auto;
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  #sidebar h1 {
    font-size: 15px; font-weight: 600; color: #fff;
    letter-spacing: -0.01em; margin-bottom: 4px;
  }
  #sidebar .subtitle { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 12px; }

  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 12px;
  }
  .stat-row .label { color: rgba(255,255,255,0.5); }
  .stat-row .value { color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }

  #stats { margin-bottom: 10px; }

  .section-title {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.3);
    text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 6px;
  }

  .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }

  .btn {
    flex: 1; min-width: 60px; padding: 6px 8px; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px; background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.6); font-size: 11px; cursor: pointer;
    text-align: center; transition: all 0.15s;
  }
  .btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .btn.active { background: rgba(94,106,210,0.2); border-color: rgba(94,106,210,0.4); color: #5e6ad2; }
  .btn-success { border-color: rgba(76,175,80,0.3); color: #4caf50; }
  .btn-success:hover { background: rgba(76,175,80,0.1); }
  .btn-danger { border-color: rgba(230,57,70,0.3); color: #e63946; }
  .btn-danger:hover { background: rgba(230,57,70,0.1); }
  .btn-export { background: rgba(233,196,106,0.1); border-color: rgba(233,196,106,0.3); color: #e9c46a; width: 100%; margin-top: 6px; }
  .btn-export:hover { background: rgba(233,196,106,0.2); }

  /* Legend */
  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 2px 0; color: rgba(255,255,255,0.6); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Sync indicator */
  #sync-indicator {
    font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 8px;
    display: flex; align-items: center; gap: 4px;
  }
  #sync-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; }
  #sync-indicator.syncing .dot { background: #e9c46a; animation: pulse 0.5s infinite; }
  #sync-indicator.error .dot { background: #e63946; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* Notification */
  #notification {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 9999; padding: 10px 20px; border-radius: 8px;
    background: rgba(15,25,35,0.95); color: #fff; font-size: 13px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: opacity 0.3s; pointer-events: none;
    opacity: 0;
  }
  #notification.show { opacity: 1; }

  /* Leaflet overrides for dark theme */
  .leaflet-popup-content-wrapper {
    background: rgba(15,25,35,0.96); color: #e0e0e0;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    padding: 0;
  }
  .leaflet-popup-tip { background: rgba(15,25,35,0.96); border: 1px solid rgba(255,255,255,0.08); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 12px; line-height: 1.5; min-width: 220px; }
  .leaflet-popup-close-button { color: rgba(255,255,255,0.3) !important; }

  .popup-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .popup-info { color: rgba(255,255,255,0.6); margin-bottom: 2px; }
  .popup-info a { color: #8ab4f8; text-decoration: none; }
  .popup-info a:hover { text-decoration: underline; }

  .popup-btns { display: flex; gap: 4px; margin-top: 8px; }
  .popup-btn {
    flex: 1; text-align: center; padding: 6px 4px; border-radius: 6px;
    font-size: 11px; font-weight: 500; cursor: pointer; border: none;
    transition: all 0.15s; text-decoration: none; display: inline-block;
  }
  .popup-btn-map { background: rgba(138,180,248,0.12); color: #8ab4f8; }
  .popup-btn-map:hover { background: rgba(138,180,248,0.2); }
  .popup-btn-sv { background: rgba(76,175,80,0.12); color: #4caf50; }
  .popup-btn-sv:hover { background: rgba(76,175,80,0.2); }
  .popup-btn-keep { background: rgba(94,106,210,0.12); color: #5e6ad2; }
  .popup-btn-keep:hover { background: rgba(94,106,210,0.2); }
  .popup-btn-remove { background: rgba(230,57,70,0.12); color: #e63946; }
  .popup-btn-remove:hover { background: rgba(230,57,70,0.2); }
  .popup-btn-keep.active-btn { background: rgba(94,106,210,0.3); border: 1px solid rgba(94,106,210,0.4); }
  .popup-btn-remove.active-btn { background: rgba(230,57,70,0.3); border: 1px solid rgba(230,57,70,0.4); }

  /* Loading */
  #loading {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99999; background: #08090a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #loading .spinner {
    width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.1);
    border-top-color: #5e6ad2; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: rgba(255,255,255,0.5); font-size: 13px; }

  /* Responsive sidebar */
  @media (max-width: 640px) {
    #sidebar { width: 200px; padding: 12px; top: 8px; left: 8px; }
    #sidebar h1 { font-size: 13px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Cargando mapa…</p>
</div>

<div id="map"></div>

<div id="sidebar">
  <h1>🚌 Marquesinas SV</h1>
  <div class="subtitle">Selecciona las paradas para tu ruta</div>

  <div id="stats">
    <div class="stat-row"><span class="label">Total con SV</span><span class="value" id="stat-total">20.009</span></div>
    <div class="stat-row"><span class="label">Mantener</span><span class="value" id="stat-kept" style="color:#5e6ad2">0</span></div>
    <div class="stat-row"><span class="label">Quitar</span><span class="value" id="stat-skipped" style="color:#e63946">0</span></div>
    <div class="stat-row"><span class="label">Pendientes</span><span class="value" id="stat-pending">20.009</span></div>
  </div>

  <div class="section-title">Filtro</div>
  <div class="btn-group">
    <button class="btn active" data-filter="all" onclick="setFilter('all')">Todas</button>
    <button class="btn" data-filter="kept" onclick="setFilter('kept')" style="color:#5e6ad2">✅ Mantener</button>
    <button class="btn" data-filter="pending" onclick="setFilter('pending')">Pendientes</button>
  </div>

  <div class="section-title">Leyenda</div>
  <div class="legend-row"><span class="legend-dot" style="background:#5e6ad2"></span>✅ Mantener</div>
  <div class="legend-row"><span class="legend-dot" style="background:#e63946"></span>❌ Quitar</div>
  <div class="legend-row"><span class="legend-dot" style="background:rgba(255,255,255,0.25)"></span>⏳ Pendiente</div>

  <div style="margin-top:8px">
    <button class="btn btn-export" onclick="exportRoute()">📥 Exportar CSV</button>
  </div>

  <div id="sync-indicator">
    <span class="dot"></span>
    <span id="sync-text">Sincronizado</span>
  </div>
</div>

<div id="notification"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== CONFIG =====
const GEOJSON_URL = 'stops.geojson';
const API_URL = 'api.php';
const POLL_INTERVAL = 5000; // 5s

// ===== BACKEND STATE =====
// In-memory mirrors of DB state
let _kept = [];      // [{id, lat, lng, name}]
let _removed = [];   // [stop_id]
let _lastPollTime = '1970-01-01 00:00:00';
let _apiOnline = true;

function isKept(id)    { return _kept.some(s => s.id === id || s.stop_id === id); }
function isRemoved(id) { return _removed.includes(id); }
function isPending(id) { return !isKept(id) && !isRemoved(id); }

// ===== LOCAL STORAGE (primary fallback) =====
function loadFromLocal() {
  try {
    const k = localStorage.getItem('sv_kept');
    const r = localStorage.getItem('sv_removed');
    if (k) _kept = JSON.parse(k);
    if (r) _removed = JSON.parse(r);
    console.log(`[Local] Loaded ${_kept.length} kept, ${_removed.length} removed from localStorage`);
  } catch(e) { console.warn('[Local] Failed to read localStorage:', e); }
}

function saveToLocal() {
  try {
    localStorage.setItem('sv_kept', JSON.stringify(_kept));
    localStorage.setItem('sv_removed', JSON.stringify(_removed));
  } catch(e) { /* localStorage full — ignore */ }
}

// ===== API CALLS =====
async function apiGet() {
  const r = await fetch(`${API_URL}?action=get`);
  if (!r.ok) throw new Error('API get failed');
  return r.json();
}

async function apiSave(stopId, decision, lat, lng, name) {
  const r = await fetch(`${API_URL}?action=save`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ stop_id: stopId, decision, lat, lng, name })
  });
  if (!r.ok) throw new Error('API save failed');
  return r.json();
}

async function apiDelete(stopId) {
  const r = await fetch(`${API_URL}?action=delete`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ stop_id: stopId })
  });
  if (!r.ok) throw new Error('API delete failed');
  return r.json();
}

async function apiPoll() {
  const r = await fetch(`${API_URL}?action=poll&since=${encodeURIComponent(_lastPollTime)}`);
  if (!r.ok) throw new Error('API poll failed');
  return r.json();
}

// ===== LOAD DECISIONS (try API, fallback localStorage) =====
async function loadDecisions() {
  // Always load localStorage first as baseline
  loadFromLocal();
  
  try {
    const data = await apiGet();
    // API succeeded — merge with local (API is source of truth)
    _kept = data.kept || [];
    _removed = (data.removed || []).map(d => typeof d === 'string' ? d : d.stop_id);
    // Set poll time to latest
    if (_kept.length > 0) {
      const latestKept = _kept.reduce((a, b) => (a.updated_at > b.updated_at ? a : b));
      if (latestKept.updated_at > _lastPollTime) _lastPollTime = latestKept.updated_at;
    }
    // Sync localStorage with API data
    saveToLocal();
    _apiOnline = true;
    setSyncStatus('ok');
  } catch (e) {
    console.warn('API failed, using localStorage data:', e);
    _apiOnline = false;
    setSyncStatus('error');
  }
}

// ===== MARK DECISIONS (now via API) =====
async function markKept(feat) {
  const id = feat.properties.stop_id;
  const lat = feat.geometry.coordinates[1];
  const lng = feat.geometry.coordinates[0];
  const name = feat.properties.name;
  
  // Optimistic UI update
  _removed = _removed.filter(d => d !== id);
  if (!isKept(id)) {
    _kept.push({ id, stop_id: id, lat, lng, name, updated_at: new Date().toISOString() });
  }
  saveToLocal(); // Always save locally
  updateStats();
  updateMarkerStyle(id);
  showNotification('✅ Mantenida: ' + name);
  
  // Try API persist
  if (_apiOnline) {
    try {
      await apiSave(id, 'kept', lat, lng, name);
      setSyncStatus('ok');
    } catch (e) {
      console.error('API save failed, kept in localStorage:', e);
      _apiOnline = false;
      setSyncStatus('error');
    }
  }
}

async function markRemoved(feat) {
  const id = feat.properties.stop_id;
  
  // Optimistic UI update
  _kept = _kept.filter(s => (s.id || s.stop_id) !== id);
  if (!isRemoved(id)) {
    _removed.push(id);
  }
  saveToLocal(); // Always save locally
  updateStats();
  updateMarkerStyle(id);
  showNotification('❌ Quitada: ' + feat.properties.name);
  
  // Try API persist
  if (_apiOnline) {
    try {
      await apiSave(id, 'removed', null, null, '');
      setSyncStatus('ok');
    } catch (e) {
      console.error('API save failed, kept in localStorage:', e);
      _apiOnline = false;
      setSyncStatus('error');
    }
  }
}

async function unmarkDecision(feat) {
  const id = feat.properties.stop_id;
  
  // Optimistic UI update
  _kept = _kept.filter(s => (s.id || s.stop_id) !== id);
  _removed = _removed.filter(d => d !== id);
  saveToLocal(); // Always save locally
  updateStats();
  updateMarkerStyle(id);
  showNotification('↩️ Pendiente: ' + feat.properties.name);
  
  // Try API delete
  if (_apiOnline) {
    try {
      await apiDelete(id);
      setSyncStatus('ok');
    } catch (e) {
      console.error('API delete failed, kept in localStorage:', e);
      _apiOnline = false;
      setSyncStatus('error');
    }
  }
}

// ===== LOCAL BACKUP (fallback) =====
function saveDecisionsLocal() {
  try {
    localStorage.setItem('sv_kept', JSON.stringify(_kept));
    localStorage.setItem('sv_removed', JSON.stringify(_removed));
  } catch (e) { /* localStorage full — ignore */ }
}

// ===== SYNC STATUS =====
function setSyncStatus(status) {
  const el = document.getElementById('sync-indicator');
  const text = document.getElementById('sync-text');
  el.className = '';
  if (status === 'ok') {
    text.textContent = 'Sincronizado';
  } else if (status === 'syncing') {
    el.className = 'syncing';
    text.textContent = 'Sincronizando…';
  } else {
    el.className = 'error';
    text.textContent = 'Sin conexión';
  }
}

// ===== POLLING (hot reload) =====
let pollTimer = null;

async function pollChanges() {
  try {
    setSyncStatus('syncing');
    const data = await apiPoll();
    _lastPollTime = data.server_time;
    
    if (data.changes && data.changes.length > 0) {
      let changed = 0;
      // Apply remote changes to local state
      data.changes.forEach(c => {
        const id = c.stop_id;
        
        if (c.decision === 'kept') {
          _removed = _removed.filter(d => d !== id);
          if (!isKept(id)) {
            _kept.push({ id, stop_id: id, lat: parseFloat(c.lat), lng: parseFloat(c.lng), name: c.name, updated_at: c.updated_at });
          }
        } else if (c.decision === 'removed') {
          _kept = _kept.filter(s => (s.id || s.stop_id) !== id);
          if (!_removed.includes(id)) {
            _removed.push(id);
          }
        }
        // Update marker color + visibility
        const marker = allMarkers.find(m => m._props.stop_id === id);
        if (marker) {
          updateMarkerStyle(id);
          applyFilterToOne(marker, id);
        }
        changed++;
      });
      
      saveDecisionsLocal();
      updateStats();
      if (changed > 0) {
        showNotification(`🔄 ${changed} cambio${changed > 1 ? 's' : ''} sincronizado${changed > 1 ? 's' : ''}`);
      }
    }
    
    setSyncStatus('ok');
  } catch (e) {
    console.warn('Poll failed:', e);
    setSyncStatus('error');
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollChanges, POLL_INTERVAL);
}

// ===== NOTIFICATION =====
function showNotification(msg) {
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
}

// ===== MAP =====
const map = window._galiciaMap = L.map('map', {
  preferCanvas: true,
  center: [42.65, -8.15],
  zoom: 8,
  zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ===== MARKERS =====
let allMarkers = [];
let currentFilter = 'all';

function getShelterColor(type) {
  const colors = {
    'marquesina_metalica': '#2a9d8f',
    'marquesina_cerrada': '#264653',
    'moderna_xunta': '#e63946',
    'poste_marcado': '#457b9d',
    'poste_simple': '#a8dadc',
    'poste_rural': '#6d6875'
  };
  return colors[type] || '#888';
}

function updateMarkerStyle(stopId) {
  allMarkers.forEach(m => {
    if (m._props.stop_id === stopId) {
      let color, radius;
      if (isKept(stopId)) {
        color = '#5e6ad2';
        radius = 9;
      } else if (isRemoved(stopId)) {
        color = '#e63946';
        radius = 6;
      } else {
        color = 'rgba(255,255,255,0.25)';
        radius = 6;
      }
      m.setStyle({ fillColor: color, color: color, radius: radius });
    }
  });
}

function createPopup(feat) {
  const p = feat.properties;
  const coords = feat.geometry.coordinates;
  const lat = coords[1];
  const lng = coords[0];
  const id = p.stop_id;
  const name = p.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  const color = getShelterColor(p.shelter_type);
  const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
  const svUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;

  let keptClass = isKept(id) ? 'active-btn' : '';
  let removedClass = isRemoved(id) ? 'active-btn' : '';

  return `<div>
    <div class="popup-name">${p.name}</div>
    <div class="popup-info"><span style="color:${color}">■</span> ${p.shelter_icon} ${p.shelter_label}</div>
    <div class="popup-info">🚌 ${p.route_count} línea(s) · ${p.province}</div>
    <div class="popup-info">📍 <a href="${mapsUrl}" target="_blank" rel="noopener">${lat.toFixed(5)}, ${lng.toFixed(5)}</a></div>
    <div class="popup-btns">
      <a href="${mapsUrl}" target="_blank" rel="noopener" class="popup-btn popup-btn-map" title="Abrir en Google Maps">📍 Maps</a>
      <a href="${svUrl}" target="_blank" rel="noopener" class="popup-btn popup-btn-sv" title="Abrir Street View">👁️ SV</a>
    </div>
    <div class="popup-btns">
      <button class="popup-btn popup-btn-keep ${keptClass}" onclick="parent.markKeptFromPopup('${id}')" title="Mantener en ruta">✅ Mantener</button>
      <button class="popup-btn popup-btn-remove ${removedClass}" onclick="parent.markRemovedFromPopup('${id}')" title="Quitar de la ruta">❌ Quitar</button>
    </div>
  </div>`;
}

// Functions callable from popup (iframe scope workaround)
function markKeptFromPopup(id) {
  const marker = allMarkers.find(m => m._props.stop_id === id);
  if (marker) {
    markKept({ properties: marker._props, geometry: marker._geo });
    marker.getPopup()?.setContent(createPopup({ properties: marker._props, geometry: marker._geo }));
  }
}
function markRemovedFromPopup(id) {
  const marker = allMarkers.find(m => m._props.stop_id === id);
  if (marker) {
    markRemoved({ properties: marker._props, geometry: marker._geo });
    marker.getPopup()?.setContent(createPopup({ properties: marker._props, geometry: marker._geo }));
  }
}
window.markKeptFromPopup = markKeptFromPopup;
window.markRemovedFromPopup = markRemovedFromPopup;

// ===== INIT: Load DB then GeoJSON =====
async function init() {
  // 1. Load decisions from DB
  await loadDecisionsFromDB();
  
  // 2. Load GeoJSON
  try {
    const r = await fetch(GEOJSON_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const geojson = await r.json();
    
    document.getElementById('loading').style.display = 'none';
    
    geojson.features.forEach(f => {
      const coords = f.geometry.coordinates;
      const lat = coords[1], lng = coords[0];
      const p = f.properties;
      const id = p.stop_id;
      
      // Determine style from DB state
      let color, radius;
      if (isKept(id)) {
        color = '#5e6ad2';
        radius = 9;
      } else if (isRemoved(id)) {
        color = '#e63946';
        radius = 6;
      } else {
        color = 'rgba(255,255,255,0.25)';
        radius = 6;
      }
      
      const marker = L.circleMarker([lat, lng], {
        radius: radius,
        fillColor: color,
        color: color,
        weight: 1,
        opacity: 0.8,
        fillOpacity: 0.7
      });
      
      marker._props = p;
      marker._geo = f.geometry;
      marker.bindPopup(createPopup(f));
      
      // Only add to map if not removed
      if (!isRemoved(id)) {
        marker.addTo(map);
      }
      
      allMarkers.push(marker);
    });
    
    updateStats();
    
    // 3. Start polling for hot reload
    startPolling();
    
  } catch (err) {
    document.getElementById('loading').innerHTML = '<p style="color:#e63946">Error: ' + err.message + '</p>';
  }
}

// ===== FILTER =====
function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
  applyFilter();
}

function applyFilter() {
  allMarkers.forEach(m => {
    const id = m._props.stop_id;
    let show = false;
    if (currentFilter === 'all') {
      show = !isRemoved(id);
    } else if (currentFilter === 'kept') {
      show = isKept(id);
    } else if (currentFilter === 'pending') {
      show = isPending(id);
    }
    if (show && !map.hasLayer(m)) {
      m.addTo(map);
    } else if (!show && map.hasLayer(m)) {
      map.removeLayer(m);
    }
  });
}

function applyFilterToOne(marker, id) {
  let show = false;
  if (currentFilter === 'all') {
    show = !isRemoved(id);
  } else if (currentFilter === 'kept') {
    show = isKept(id);
  } else if (currentFilter === 'pending') {
    show = isPending(id);
  }
  if (show && !map.hasLayer(marker)) {
    marker.addTo(map);
  } else if (!show && map.hasLayer(marker)) {
    map.removeLayer(marker);
  }
}

// ===== STATS =====
function updateStats() {
  const total = 20009;
  const kept = _kept.length;
  const removed = _removed.length;
  document.getElementById('stat-kept').textContent = kept.toLocaleString();
  document.getElementById('stat-skipped').textContent = removed.toLocaleString();
  document.getElementById('stat-pending').textContent = (total - kept - removed).toLocaleString();
  applyFilter();
}

// ===== EXPORT =====
function exportRoute() {
  if (_kept.length === 0) {
    showNotification('⚠️ No hay paradas marcadas para exportar');
    return;
  }
  let csv = 'stop_id,lat,lng,name,province,shelter_type\n';
  _kept.forEach(s => {
    const id = s.id || s.stop_id;
    csv += `${id},${s.lat},${s.lng},"${s.name}",,\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ruta_marquesinas.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showNotification(`📥 Exportadas ${_kept.length} paradas`);
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') map.closePopup();
});

// Boot
init();
</script>
